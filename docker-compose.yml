services:
  corrective-rag:
    build: .
    image: corrective-rag:local
    restart: unless-stopped
    env_file: .env
    environment:
      CRAG_ADDR: ":8080"
      CRAG_KB_PATH: /app/data/knowledge_base.json
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
