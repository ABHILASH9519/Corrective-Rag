name: Go CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Format Go source
        run: gofmt -w $(find . -name '*.go' -type f)
      - run: go vet ./...
      - run: go test -race -cover ./...
      - run: go build -trimpath ./cmd/crag
