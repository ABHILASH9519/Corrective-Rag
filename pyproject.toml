[project]
name = "corrective-rag"
version = "1.0.0"
description = "Production-ready Corrective RAG (CRAG) help desk: grades its own retrieval, refines knowledge, falls back to the web, and cites every source."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Abhilash Sharma" }]
keywords = ["rag", "corrective-rag", "langgraph", "chromadb", "groq", "llm"]
dependencies = [
    "langgraph==1.2.12",
    "groq==1.7.0",
    "chromadb==1.5.9",
    "ddgs==9.16.0",
    "python-dotenv==1.2.4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
crag = "crag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
